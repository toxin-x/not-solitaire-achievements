# Publishes the site exactly as before, but with the achievement list pre-rendered into index.html
# so search engines can read it. Needs Settings > Pages > Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Pre-render achievement list
        # if this ever fails, the site still deploys, just without the pre-rendered list
        continue-on-error: true
        run: |
          node .github/prerender.js > "$RUNNER_TEMP/index.html"
          mv "$RUNNER_TEMP/index.html" index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
